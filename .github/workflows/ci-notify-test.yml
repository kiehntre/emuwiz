name: CI notification tests

on:
  pull_request:
    paths:
      - .github/workflows/ci-notify*.yml
      - scripts/ci-notify.cjs
      - scripts/ci-notify.test.cjs
      - scripts/classify-ci-changes.sh

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: node --test scripts/ci-notify.test.cjs
