name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate guard scripts
        run: |
          bash -n scripts/check-main-rs-boundary.sh
          bash -n scripts/check-working-tree-scope.sh
          bash -n scripts/task-preflight.sh
          bash -n scripts/task-postcheck.sh
      - name: Check main.rs boundary against PR base
        run: scripts/check-main-rs-boundary.sh --base "${{ github.event.pull_request.base.sha }}"

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      # Ratchet: errors and deny-level lints fail Clippy itself; warnings may not
      # exceed .github/clippy-warning-baseline. Lower the baseline as the backlog is fixed.
      - run: scripts/clippy-ratchet.sh

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools for real patch and optical-conversion tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xdelta3 mame-tools
      - name: Verify Xdelta3 is available
        run: |
          test -x /usr/bin/xdelta3
          command -v xdelta3
          xdelta3 -V
      - name: Verify CHDman is available
        run: |
          test -x /usr/bin/chdman
          # CHDman returns 1 after printing help; still reject execution failures.
          chdman_help=$(/usr/bin/chdman help 2>&1) || test "$?" -eq 1
          printf '%s\n' "$chdman_help"
          grep -Fq 'MAME Compressed Hunks of Data' <<< "$chdman_help"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      # R2 admits only canonical local ext4 with 4096-byte blocks, and the hosted
      # runner's temp filesystem is not guaranteed to be one (it failed the R2
      # eligibility gate). Put the test temp dir on a disposable loop ext4 so the
      # supported R2 paths run for real; the gate itself is not relaxed.
      # EMUWIZ_R2_REQUIRE_QUALIFIED makes a refusal on this filesystem a failure.
      - name: Create qualified disposable ext4 for R2 tests
        run: |
          # Under /tmp and short: some tests require a host-/tmp path and build
          # Unix-socket paths that must stay under SUN_LEN.
          img="$RUNNER_TEMP/r2-ext4.img"
          mnt=/tmp/r2e
          truncate -s 4G "$img"
          mkfs.ext4 -q -b 4096 -F "$img"
          sudo mkdir -p "$mnt"
          sudo mount -o loop "$img" "$mnt"
          sudo chown "$(id -u):$(id -g)" "$mnt"
          findmnt -no FSTYPE "$mnt" | grep -qx ext4
          echo "TMPDIR=$mnt" >> "$GITHUB_ENV"
          echo "EMUWIZ_R2_REQUIRE_QUALIFIED=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  # Independent of the workspace suite so unrelated failures there cannot stop
  # the R2 filesystem-gate proofs from running. The gate itself is not relaxed.
  r2-filesystem-gate:
    name: R2 filesystem gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Unsupported filesystem (tmpfs) must be refused
        env:
          TMPDIR: /dev/shm
          EMUWIZ_R2_REQUIRE_REFUSAL: "1"
        run: cargo test -p archivefs-cli --test r2_blue
      - name: Qualified loop ext4 must succeed
        run: |
          img="$RUNNER_TEMP/r2-ext4.img"
          mnt="$RUNNER_TEMP/r2-ext4"
          truncate -s 1G "$img"
          mkfs.ext4 -q -b 4096 -F "$img"
          mkdir "$mnt"
          sudo mount -o loop "$img" "$mnt"
          sudo chown "$(id -u):$(id -g)" "$mnt"
          findmnt -no FSTYPE "$mnt" | grep -qx ext4
          TMPDIR="$mnt" EMUWIZ_R2_REQUIRE_QUALIFIED=1 \
            cargo test -p archivefs-cli --test r2_blue

  release-build:
    name: Locked release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - run: cargo build --workspace --release --locked
      - run: scripts/check-version-consistency.sh --binary-dir target/release

  security:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Test credential-URL classification
        run: bash scripts/test-security-scan.sh
      - name: Scan tracked files for credential-shaped secrets
        run: scripts/security-scan.sh
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit resolved dependencies
        run: cargo audit

  install-script-tests:
    name: Installer script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # desktop-file-validate (from desktop-file-utils) is exercised by
      # tests/test_install.sh; without it, those assertions silently skip
      # and the desktop entry's Desktop Entry Specification syntax is
      # never actually checked in CI.
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: bash tests/test_install_environment_isolation.sh
      - run: bash scripts/test-check-version-consistency.sh
      - run: bash tests/test_install.sh
      - run: python3 tests/test_installer_asset_races.py
      - run: python3 tests/test_installer_upgrade_preservation.py

  release-artifact:
    name: Create canonical artifact
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, release-build, security]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      # See the comment on the install-script-tests job: without this,
      # build-release.sh's and verify-release-artifact.sh's
      # desktop-file-validate checks silently no-op in CI.
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Build and internally verify artifact
        run: scripts/build-release.sh --output-dir "$RUNNER_TEMP/release"
      - name: Reject representative malformed artifacts
        run: scripts/test-release-artifact-verifier.sh "$RUNNER_TEMP/release/"*.tar.xz
      - name: Check artifact and binary versions
        run: |
          scripts/check-version-consistency.sh \
            --binary-dir target/release \
            --artifact "$RUNNER_TEMP/release/"*.tar.xz \
            --checksum "$RUNNER_TEMP/release/"*.tar.xz.sha256
      - name: Upload untrusted CI artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: archivefs-release-candidate
          path: |
            ${{ runner.temp }}/release/*.tar.xz
            ${{ runner.temp }}/release/*.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    name: Verify downloaded artifact
    runs-on: ubuntu-latest
    needs: release-artifact
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: actions/download-artifact@v5
        with:
          name: archivefs-release-candidate
          path: ${{ runner.temp }}/download
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: scripts/verify-release-artifact.sh "$RUNNER_TEMP/download/"*.tar.xz

  reproducibility:
    name: Reproducibility
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, release-build, security]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Test reproducibility orchestration and archive diagnostics
        run: python3 -B scripts/release/test_release_reproducibility.py
      - name: Build twice in independent clean directories
        run: scripts/compare-release-builds.sh --output-dir "$RUNNER_TEMP/reproducibility"
