name: CI completion notification

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
  # Supplemental external checks; GitHub suppresses Actions check_run recursion.
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact open PR head to evaluate once
        required: true
        type: string

permissions:
  contents: read

# Serialize both workflow completion events for a head. A replacement pending
# event reads the complete current state, so coalescing events is safe.
concurrency:
  group: ci-notify-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || inputs.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions')
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Never check out a PR head, run artifact, cache or PR-controlled ref.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./scripts/ci-notify.cjs').notify({github, context, core});
