[package]
name = "archivefs-cli"
version.workspace = true
edition.workspace = true
autobins = false

# `archivefs-cli` remains a legacy compatibility alias created by install.sh.
[[bin]]
name = "emuwiz-cli"
path = "src/main.rs"

[dependencies]
archivefs-core = { path = "../archivefs-core" }
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
libc = "0.2"

[dev-dependencies]
archivefs-core = { path = "../archivefs-core", features = ["test-support"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["backup", "bundled"] }
tempfile = "3"

[[bin]]
name = "emuwiz-r2"
path = "src/bin/emuwiz-r2.rs"
