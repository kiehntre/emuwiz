[package]
name = "archivefs-cli"
version.workspace = true
edition.workspace = true
autobins = false

# `archivefs-cli` remains a legacy compatibility alias created by install.sh.
[[bin]]
name = "emuwiz-cli"
path = "src/main.rs"

[dependencies]
archivefs-core = { path = "../archivefs-core" }
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
